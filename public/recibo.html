<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo de Reciclaje</title>
    <style>
        body { font-family: sans-serif; background-color: #e8f5e9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .ticket { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 300px; width: 100%; border-top: 10px solid #28a745; }
        .check { font-size: 50px; margin: 0; }
        h2 { color: #28a745; margin-bottom: 5px; }
        .puntos { font-size: 40px; color: #333; margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ticket">
        <p class="check">✅</p>
        <h2>¡Reciclaje Exitoso!</h2>
        <p style="color: #666; font-size: 14px; margin-top:0;">Transacción verificada</p>
        
        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">
        
        <p><strong>Material:</strong> <span id="lbl-material"></span></p>
        <p><strong>Código:</strong> <span id="lbl-codigo"></span></p>
        
        <div class="puntos">+<span id="lbl-puntos"></span> Pts</div>
        
        <p style="color: #666; font-size: 14px;">Gracias por cuidar la ciudad 🌍</p>
    </div>

    <script>
        // Lee los datos ocultos en el enlace que generó el QR
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('lbl-codigo').innerText = urlParams.get('codigo') || 'N/A';
        document.getElementById('lbl-material').innerText = urlParams.get('material') || 'N/A';
        document.getElementById('lbl-puntos').innerText = urlParams.get('puntos') || '0';
    </script>
</body>
</html>
