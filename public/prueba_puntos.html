<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Avance: Gamificación de Reciclaje</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; display: flex; justify-content: center; }
        .tarjeta { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; margin: 8px 0 15px 0; padding: 10px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h2 style="text-align: center; color: #333;">Registrar Entrega</h2>

        <label>Material Reciclado:</label>
        <input type="text" id="material" value="Plástico PET">

        <label>Peso en Kg:</label>
        <input type="number" id="peso" value="2.5" step="0.1">

        <label>Eco-Puntos a ganar:</label>
        <input type="number" id="puntos" value="50">

        <!-- Este botón activa la función que se comunica con tu server.js -->
        <button onclick="enviarEntrega()">Simular Escaneo y Sumar Puntos</button>

        <h4 id="resultado" style="color: #0056b3; text-align: center; min-height: 20px;"></h4>
        <img id="imagen-qr" src="" alt="Tu Código QR de Reciclaje" style="display: none; width: 100%; max-width: 200px; margin: 0 auto; border-radius: 8px;">
    </div>

    <script>
        async function enviarEntrega() {
            // Armamos el paquete de datos tal como lo espera tu backend
            const datos = {
                id_ciudadano: 1, // El ID tuyo que creamos en pgAdmin
                id_acopio: 1,    // El ID del punto de acopio
                tipo_material: document.getElementById('material').value,
                peso_kg: document.getElementById('peso').value,
                puntos_ganados: document.getElementById('puntos').value,
                codigo_qr: "QR_DEMO_" + Date.now() // Simula un código de validación único
            };

            try {
                // Hacemos la petición POST a la ruta que creaste en server.js
                const respuesta = await fetch('/api/registrar-reciclaje', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const data = await respuesta.json();
                const imagenQR = document.getElementById('imagen-qr');
                // Mostramos el mensaje de éxito o error en la pantalla
                document.getElementById('resultado').innerText = data.mensaje || data.error;
                if (data.qr_imagen) {
                    imagenQR.src = data.qr_imagen;
                    imagenQR.style.display = 'block';
                } else {
                    imagenQR.removeAttribute('src');
                    imagenQR.style.display = 'none';
                }
            } catch (error) {
                document.getElementById('resultado').innerText = "Error de conexión con el servidor.";
            }
        }
    </script>
</body>
</html>
