      background: white;
      border: 3px solid #22c55e;

    svg { width: 300px; height: 300px; display: block; }
    pre {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #0f172a;
      overflow-x: auto;
